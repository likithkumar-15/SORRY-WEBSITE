<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iOS 26 Glass Theme with Emoji Shower ❤️🤍🩷🕸️🕷️</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #ffc0cb);
    color: #222;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .rose-petals {
    pointer-events: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: visible;
    z-index: 0;
  }

  .petal {
    position: absolute;
    top: -50px;
    width: 50px;
    height: 50px;
    opacity: 0.95;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
    animation-duration: var(--fall-duration), var(--sway-duration);
    animation-delay: var(--fall-delay), var(--sway-delay);
    transform-origin: center bottom;
    user-select: none;
    font-size: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  @keyframes fall {
    0% {
      top: -50px;
      opacity: 0.95;
      transform: translateX(0) rotate(0deg);
    }
    100% {
      top: 110vh;
      opacity: 0.2;
      transform: translateX(100px) rotate(360deg);
    }
  }

  @keyframes sway {
    0%, 100% {
      transform: translateX(0) rotate(0deg);
    }
    50% {
      transform: translateX(20px) rotate(30deg);
    }
  }

  .page {
    display: none;
    background: rgba(255, 255, 255, 0.15);
    box-shadow:
      0 8px 48px 0 rgba(31, 38, 135, 0.15),
      0 0 0 1px rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    min-width: 320px;
    max-width: 390px;
    padding: 40px 30px;
    box-sizing: border-box;
    text-align: center;
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #222;
    position: relative;
    z-index: 1;
  }

  #page1 { background: rgba(255, 255, 255, 0.10); }
  .active { display: flex; }

  .page h1 {
    font-family: "Bookman Old Style", serif;
    font-weight: 700;
    font-style: italic;
    font-size: 3rem;
    color: #000;
    text-align: center;
    text-shadow:
      2px 2px 3px rgba(60,60,60,0.9),
      0 0 8px rgba(40,40,40,0.7),
      0 0 12px rgba(70,70,70,0.6);
    margin: 0 auto 25px auto;
    user-select: none;
  }

  #page2 h1,
  #page3 h1 {
    font-size: 2rem;
  }
  #page3 h1 {
    margin-bottom: 15px;
  }

  #page1 img.additional-image,
  #page2 img,
  #page3 img {
    max-width: 100%;
    border-radius: 15px;
    user-select: none;
    display: block;
    margin: 0 auto 25px auto;
  }

  #page4 div {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 18px !important;
    justify-content: center !important;
    margin-top: 20px;
  }

  #page4 button {
    width: 220px;
    padding: 18px 0;
    font-size: 1.3rem;
    border-radius: 20px;
    border: none;
    background: linear-gradient(135deg, #d7deffdd, #ffd6e8dd);
    color: #222;
    box-shadow:
      0 8px 40px 0 rgba(187, 204, 255, 0.4),
      inset 0 -2px 6px 0 rgba(255, 225, 238, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    transition: all 0.25s ease;
    font-weight: 700;
    text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);
  }

  #page4 button:hover {
    background: linear-gradient(135deg, #bac8ffee, #fbb4cdcc);
    box-shadow:
      0 12px 50px 0 rgba(187, 204, 255, 0.6),
      inset 0 -4px 12px 0 rgba(255, 225, 238, 0.9);
    transform: translateY(-2px);
  }

  #page4 button:active {
    background: linear-gradient(135deg, #808fffcc, #d87ea4cc);
    box-shadow:
      inset 0 2px 8px rgba(70, 60, 90, 0.4);
    transform: translateY(2px);
  }

  #thankYouPage h1 {
    font-weight: 800;
    color: #ff5c8d;
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  #thankYouPage img {
    max-width: 200px;
    margin: 0 auto;
    display: block;
    border-radius: 15px;
  }

  #lovePage h1 {
    font-weight: 800;
    color: #e63946; /* More reddish */
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  #lovePage img {
    max-width: 200px;
    border-radius: 15px;
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="rose-petals" aria-hidden="true" id="spiderShower"></div>

<div id="page1" class="page active" onclick="goToPage('page2')" role="button" tabindex="0">
  <h1>SORRY...!</h1>
  <img src="https://s3.getstickerpack.com/storage/uploads/sticker-pack/doraemon-2-2/sticker_20.png?8fcfa089f2dbe26fc69090028616ed81" alt="Doraemon Sticker" class="additional-image" />
</div>

<div id="page2" class="page" onclick="goToPage('page3')" role="button" tabindex="0" style="display:none;">
  <h1>Please forgive me please 🥺</h1>
  <img src="https://i.pinimg.com/originals/a9/64/e1/a964e1631de2a9dadbf3772c3db0a98f.gif" alt="Spider Gif" />
</div>

<div id="page3" class="page" onclick="goToPage('page4')" role="button" tabindex="0" style="display:none;">
  <h1>Please Kulli ma forgive me</h1>
  <img src="https://s3.getstickerpack.com/storage/uploads/sticker-pack/duo-laa-meng-shi-yong-dong-tai-tu/sticker_1.gif?3ddc9fb11554519594a3e464aea768be&d=200x200" alt="Third Page Gif" />
</div>

<div id="page4" class="page" style="display:none;">
  <h1>Forgave me? Yes or No</h1>
  <div>
    <button onclick="processAnswer(true)">Yes</button>
    <button onclick="processAnswer(false)">No</button>
  </div>
</div>

<div id="thankYouPage" class="page" style="display:none;">
  <h1>Yay! Thank you so much</h1>
  <img src="https://s3.getstickerpack.com/storage/uploads/sticker-pack/ying-wendoraemons-animated-crayon-stickers/sticker_13.gif?f420d30e5d4c22a4f1f900eb9d328dec&d=200x200" alt="Thank You Gif" />
</div>

<div id="lovePage" class="page" style="display:none;">
  <h1>I LOVE YOU SO MUCH</h1>
  <img src="https://s3.getstickerpack.com/storage/uploads/sticker-pack/hello-kitty-x-spiderman/sticker_1.webp?9796687e4e082b409962f46400fcf480&d=200x200" alt="Hello Kitty Spiderman" />
</div>

<script>
  const pages = ['page1','page2','page3','page4','thankYouPage','lovePage'];

  function goToPage(id) {
    pages.forEach(p => document.getElementById(p).style.display = (p === id) ? 'flex' : 'none');
  }

  function processAnswer(isYes) {
    if (isYes) {
      goToPage('thankYouPage');
      setTimeout(() => goToPage('lovePage'), 2000);
    } else {
      goToPage('page2');
    }
  }

  const container = document.getElementById('spiderShower');
  const emojis = ['❤️', '🤍', '🩷', '🕸️', '🕷️'];
  const totalElements = 100;

  for (let i = 0; i < totalElements; i++) {
    const elem = document.createElement('div');
    elem.className = 'petal';
    elem.style.left = Math.random() * 100 + '%';
    elem.style.setProperty('--fall-delay', (Math.random() * 6).toFixed(2) + 's');
    elem.style.setProperty('--fall-duration', (5 + Math.random() * 2).toFixed(2) + 's');
    elem.style.setProperty('--sway-delay', (Math.random() * 3).toFixed(2) + 's');
    elem.style.setProperty('--sway-duration', (2 + Math.random() * 2).toFixed(2) + 's');

    elem.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    elem.style.userSelect = 'none';

    container.appendChild(elem);
  }
</script>

</body>
</html>
